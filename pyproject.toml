[project]
name = "wire-detection"
version = "0.1.0"
description = "Dear PyGui desktop app for YOLOv8-based wire defect detection, calibration, and measurement."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dearpygui==2.3.1",
    "mss>=9.0.0",
    "numpy>=1.24.0",
    "opencv-contrib-python>=4.10.0",
    "opencv-python>=4.10.0",
    "pillow>=10.0.0",
    "pytest==9.0.3",
    "scipy>=1.11.0",
    "torch>=2.5.0",
    "torchaudio>=2.5.0",
    "torchvision>=0.20.0",
    "ultralytics>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
